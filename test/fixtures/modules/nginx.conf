# Profile 3 of test/compat_test.py ("dynamic modules").
# Mounted read-only over /etc/nginx/nginx.conf; the other files of this directory are
# mounted at /etc/nginx/compat. The test generates /srv/img/test.png and mounts /srv/img.
load_module modules/ngx_http_xslt_filter_module.so;
load_module modules/ngx_http_image_filter_module.so;
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;

    js_import app from /etc/nginx/compat/app.js;

    server {
        listen 80;

        # xslt: transform an XML file with a stylesheet (libxml2 + libxslt).
        location /xslt/ {
            alias /etc/nginx/compat/;
            xslt_stylesheet /etc/nginx/compat/page.xsl;
        }

        # image_filter: report the image size as JSON (no re-encoding) ...
        location /img-size/ {
            alias /srv/img/;
            image_filter size;
        }
        # ... and resize it (decode + re-encode with libgd).
        location /img-resize/ {
            alias /srv/img/;
            image_filter resize 8 4;
        }

        # njs: a JavaScript handler builds the response.
        location = /njs {
            js_content app.hello;
        }
    }
}
