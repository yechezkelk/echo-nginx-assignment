# Profile 2 of test/compat_test.py ("custom config, mounted").
# Mounted read-only over /etc/nginx/conf.d/default.conf in both images.
server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # Request bodies over 1 MiB get 413. The test sends 2 MiB.
    client_max_body_size 1m;

    # A small POST is accepted; a POST over the limit gets 413 before this runs.
    location = /upload {
        return 200 "accepted\n";
    }

    # Large static file. The test generates /srv/big/large.bin (8 MiB) and mounts /srv/big.
    location /big/ {
        root /srv;
    }

    # Regex locations (matched by PCRE2): named and numbered captures, case-sensitive ...
    location ~ ^/re/(?<word>[a-z]+)/(\d+)$ {
        return 200 "word=$word num=$2\n";
    }
    # ... and case-insensitive.
    location ~* ^/icase/(.+)\.TXT$ {
        return 200 "icase=$1\n";
    }

    # Plain alias without rewrite (the normal alias path; CVE-2026-15176 changed alias handling).
    location /alias/ {
        alias /usr/share/nginx/html/;
    }
    # Alias with a regex capture, also without rewrite.
    location ~ ^/ralias/(.+)$ {
        alias /usr/share/nginx/html/$1;
    }
}
